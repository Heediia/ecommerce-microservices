apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: ecommerce
spec:
  replicas: 1

  selector:
    matchLabels:
      app: catalogue

  template:
    metadata:
      labels:
        app: catalogue

    spec:
      containers:
        - name: catalogue
          image: acrhediaecommerce.azurecr.io/catalogue:latest

          ports:
            - containerPort: 3001

          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: REDIS_PORT

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: REDIS_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20